name: Lint & Tests CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  web-lint-test:
    name: Web lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests (if present)
        run: npm run test --if-present

  mobile-lint-test:
    name: Mobile lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests (if present)
        run: npm run test --if-present

  api-lint-test:
    name: API lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test


  docker-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs:
      - web-lint-test
      - mobile-lint-test
      - api-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE != '' && vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      SHA_TAG: main-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-backend:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-backend:${{ env.SHA_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-web:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-web:${{ env.SHA_TAG }}

      - name: Build and push mobile image
        uses: docker/build-push-action@v6
        with:
          context: apps/mobile
          file: infrastructure/docker/mobile.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-mobile:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/cargoconnect-mobile:${{ env.SHA_TAG }}
