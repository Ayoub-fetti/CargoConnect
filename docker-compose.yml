services:
  backend:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/usr/src/app
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./
      dockerfile: ./infrastructure/docker/web.Dockerfile
    ports:
      - "80:3000"

  mobile:
    build:
      context: ./apps/mobile
      dockerfile: ../../infrastructure/docker/mobile.Dockerfile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./apps/mobile:/usr/src/app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend